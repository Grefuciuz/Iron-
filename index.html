:root[data-style=punk] h2{font:400 36px 'Bebas Neue',Impact,sans-serif;color:var(--ac)}
:root[data-style=punk] h3{font:400 28px 'Bebas Neue',Impact,sans-serif}
:root[data-style=punk] .f p,:root[data-style=punk] .rich,:root[data-style=punk] .empty,:root[data-style=punk] .pat{font:400 15px/1.7 'Special Elite',monospace}
:root[data-style=punk] #eb{font-family:'Special Elite',monospace;font-size:17px}
:root[data-style=punk] #et{font-family:'Bebas Neue',Impact,sans-serif;font-size:38px}
:root[data-style=punk] input{font-family:'Special Elite',monospace;font-size:16px}
:root[data-style=punk] .p1,:root[data-style=punk] .p2,:root[data-style=punk] .en{display:inline-block}

nav button{letter-spacing:.1em;font-size:10.5px}
.dl{font:600 10px Archivo;letter-spacing:.2em;color:var(--mu);text-transform:uppercase;margin-bottom:2px}
.sn{font:300 38px/1.1 Newsreader,Georgia,serif}.sn small{font:400 13px Archivo;color:var(--mu);margin-left:4px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;margin:14px 0 26px}
.wk>div{padding:8px 0;border-radius:10px;background:var(--bg2);min-height:70px}
.wk small{display:block;color:var(--mu);font-size:11px}.wk b{display:block;font-size:20px;font-weight:400;line-height:1.5;min-height:30px}
.wk .tr1{box-shadow:inset 0 -3px 0 var(--ac)}.wk .td{outline:1px solid var(--tx);outline-offset:-1px}
.bars{display:flex;align-items:flex-end;gap:6px;height:128px;margin:14px 0 6px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;font-size:10px;color:var(--mu)}
.bars i{display:block;width:100%;min-height:2px;background:var(--ac);border-radius:4px 4px 0 0}
.hb{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:14px}.hb>span{width:96px;flex:none}
.hb i{display:block;height:8px;background:var(--ac);border-radius:4px}.hb em{color:var(--mu);font-style:normal;font-size:12px;white-space:nowrap}
.ins{font:300 18px/1.6 Newsreader,Georgia,serif;margin:12px 0;padding-left:14px;border-left:2px solid var(--ac)}
.fr{display:grid;grid-template-columns:1fr 1fr auto;gap:6px 10px;align-items:center;margin:14px 0;padding-bottom:12px;border-bottom:1px solid var(--ln)}
.fr select{width:100%;font-size:15px;padding:6px 0}.fr input{grid-column:1/-1;font-size:16px}
.it[data-a]{cursor:pointer}
.sb{display:grid;grid-template-columns:1fr 1fr;gap:18px 26px;margin:8px 0 6px}.sb .dl b{color:var(--tx);font-weight:600;letter-spacing:0;margin-left:4px}
.sb input[type=number]{font-size:17px;padding:4px 0;margin-top:2px}
</style></head><body>
